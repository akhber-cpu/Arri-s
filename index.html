<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ariel Akhber — Portfolio</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="site-wrap">
        <header>
            <div class="brand">
                <div class="brand-mark">AA</div>
                <div class="brand-name">Ariel Akhber</div>
            </div>
            <a href="#contact" class="cta">Let’s Connect</a>
        </header>

        <main class="panel">
            <section class="hero">
                <h1>Video Editor & Creator</h1>
                </section>

            <section class="projects">
                <article class="card" onclick="openModal('8QjhPqj04_M')">
                    <img class="thumb" src="https://img.youtube.com/vi/8QjhPqj04_M/hqdefault.jpg" alt="Video thumbnail for Cholesterol Enths">
                </article>

                <article class="card" onclick="openModal('7mzELoA_4TA')">
                    <img class="thumb" src="https://img.youtube.com/vi/7mzELoA_4TA/hqdefault.jpg" alt="Video thumbnail for Baking Soda Ad">
                </article>

                <article class="card" onclick="openModal('eIkSXcvXmnU')">
                    <img class="thumb" src="https://img.youtube.com/vi/eIkSXcvXmnU/hqdefault.jpg" alt="Video thumbnail for Turmeric Omega Launch">
                </article>

                <article class="card" onclick="openModal('sNv0KbdY40A')">
                    <img class="thumb" src="https://img.youtube.com/vi/sNv0KbdY40A/hqdefault.jpg" alt="Video thumbnail for Social Media Campaign">
                </article>

                <article class="card" onclick="openModal('4ocju5hdgsI')">
                    <img class="thumb" src="https://img.youtube.com/vi/4ocju5hdgsI/hqdefault.jpg" alt="Video thumbnail for Product Launch">
                </article>

                <article class="card" onclick="openModal('XCvmRAv60n0')">
                    <img class="thumb" src="https://img.youtube.com/vi/XCvmRAv60n0/hqdefault.jpg" alt="Video thumbnail for Short Form Ad">
                </article>

                <article class="card" onclick="openModal('Ojvk73VGJRs')">
                    <img class="thumb" src="https://img.youtube.com/vi/Ojvk73VGJRs/hqdefault.jpg" alt="Video thumbnail for New Project 7">
                </article>
                
                <article class="card" onclick="openModal('cFrAQUphw9w')">
                    <img class="thumb" src="https://img.youtube.com/vi/cFrAQUphw9w/hqdefault.jpg" alt="Video thumbnail for New Project 8">
                </article>
                
                <article class="card placeholder">
                    <div class="placeholder-text">Coming Soon</div>
                </article>
            </section>

            <section id="contact">
                <div class="about">
                    <h4>ABOUT ME</h4>
                    <p>Experienced video editor with a background in news and branded content, currently specializing in direct response advertising. My work balances precision with a focus on viewer attention and engagement.</p>
                </div>
                <div class="social-links">
                    <a href="mailto:akhber@gmail.com"><i class="fas fa-envelope"></i></a>
                    <a href="https://www.linkedin.com/in/ariel-akhber-a75b20251" target="_blank"><i class="fab fa-linkedin"></i></a>
                    <a href="https://www.instagram.com/arielakhber/" target="_blank"><i class="fab fa-instagram"></i></a>
                </div>
            </section>
        </main>
    </div>

    <div id="videoModal" class="modal">
        <span class="close" onclick="closeModal()">×</span>
        <div class="modal-content">
            <iframe id="videoFrame" src="" allow="autoplay; encrypted-media" allowfullscreen></iframe>
        </div>
    </div>

    <script>
        function openModal(videoId){
            document.getElementById("videoModal").style.display = "flex";
            document.getElementById("videoFrame").src = "https://www.youtube.com/embed/" + videoId + "?autoplay=1";
        }

        function closeModal(){
            document.getElementById("videoModal").style.display = "none";
            document.getElementById("videoFrame").src = ""; 
        }

        // GLOW effect on ABOUT ME section when clicking 'Let’s Connect'
        document.addEventListener('DOMContentLoaded', function () {
            const connectBtn = document.querySelector('.cta');
            const contactSection = document.getElementById('contact');

            if (connectBtn && contactSection) {
                connectBtn.addEventListener('click', function (e) {
                    e.preventDefault();

                    contactSection.scrollIntoView({
                        behavior: 'smooth',
                        block: 'center'
                    });

                    // Restart the CSS animation
                    contactSection.classList.remove('glow');
                    void contactSection.offsetWidth;
                    contactSection.classList.add('glow');

                    setTimeout(() => {
                        contactSection.classList.remove('glow');
                    }, 1800);
                });
            }
        });
    </script>
</body>
</html>
