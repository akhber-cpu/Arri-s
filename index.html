<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ariel Akhber — Portfolio</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <link rel="stylesheet" href="./styles.css">
</head>

<body>
  <div class="site-wrap">
    <header>
      <div class="brand">
        <div class="brand-mark">AA</div>
        <div class="brand-name">Ariel Akhber</div>
      </div>
      <a href="#contact" class="cta">Let’s Connect</a>
    </header>

    <main class="panel">
      <section class="hero">
        <h1 class="hero-title">
          <span class="line-main">VIDEO EDITOR</span>
          <span class="line-sub">& AI VISUAL CREATOR</span>
        </h1>
      </section>

      <section class="projects" id="projectsGrid" aria-label="Video gallery"></section>

      <section id="contact">
        <div class="about">
          <h4>ABOUT ME</h4>
          <p>
            Experienced video editor with a background in news and branded content,
            currently specializing in direct response advertising.
            My work balances precision with a focus on viewer attention and engagement.
          </p>
        </div>

        <div class="social-links">
          <a href="mailto:akhber@gmail.com" aria-label="Email"><i class="fas fa-envelope"></i></a>
          <a href="https://www.linkedin.com/in/ariel-akhber-a75b20251" target="_blank" rel="noopener" aria-label="LinkedIn"><i class="fab fa-linkedin"></i></a>
          <a href="https://www.instagram.com/arielakhber/" target="_blank" rel="noopener" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
        </div>
      </section>
    </main>
  </div>

  <!-- Modal -->
  <div id="videoModal" class="modal" aria-hidden="true">
    <button class="close" type="button" aria-label="Close video">×</button>
    <div class="modal-content" role="dialog" aria-modal="true">
      <iframe id="videoFrame" src="" allow="autoplay; encrypted-media" allowfullscreen></iframe>
    </div>
  </div>

  <script>
    function openModal(videoId) {
      const modal = document.getElementById("videoModal");
      const frame = document.getElementById("videoFrame");
      modal.style.display = "flex";
      modal.setAttribute("aria-hidden", "false");
      frame.src = "https://www.youtube.com/embed/" + videoId + "?autoplay=1";
    }

    function closeModal() {
      const modal = document.getElementById("videoModal");
      const frame = document.getElementById("videoFrame");
      modal.style.display = "none";
      modal.setAttribute("aria-hidden", "true");
      frame.src = "";
    }

    const videos = [
      { id: "cFrAQUphw9w", title: "New Project 8" },
      { id: "8QjhPqj04_M", title: "Cholesterol" },
      { id: "sNv0KbdY40A", title: "Social Media Campaign" },
      { id: "XCvmRAv60n0", title: "Short Form Ad" },
      { id: "4ocju5hdgsI", title: "Product Launch" },
      { id: "Ojvk73VGJRs", title: "New Project 7" },
      { id: "7mzELoA_4TA", title: "Baking Soda Ad" },
      { id: "eIkSXcvXmnU", title: "Turmeric Omega Launch" },
      { id: "Q4pcstfcHyA", title: "New Project 9" }
    ];

    function renderGallery() {
      const grid = document.getElementById("projectsGrid");
      if (!grid) return;

      grid.innerHTML =
        videos.map(v => `
          <article class="card" data-video-id="${v.id}">
            <img
              class="thumb"
              src="https://img.youtube.com/vi/${v.id}/hqdefault.jpg"
              alt="Video thumbnail for ${v.title}"
              loading="lazy">
          </article>
        `).join("") +
        `<article class="card placeholder">
           <div class="placeholder-text">Coming Soon</div>
         </article>`;

      grid.addEventListener("click", (e) => {
        const card = e.target.closest(".card[data-video-id]");
        if (!card) return;
        openModal(card.dataset.videoId);
      });
    }

    document.addEventListener("DOMContentLoaded", () => {
      renderGallery();

      document.querySelector(".close")?.addEventListener("click", closeModal);
      const modal = document.getElementById("videoModal");
      modal?.addEventListener("click", (e) => { if (e.target === modal) closeModal(); });
      document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeModal(); });

      const connectBtn = document.querySelector(".cta");
      const contactSection = document.getElementById("contact");
      if (connectBtn && contactSection) {
        connectBtn.addEventListener("click", (e) => {
          e.preventDefault();
          contactSection.scrollIntoView({ behavior: "smooth", block: "center" });
          contactSection.classList.remove("glow");
          void contactSection.offsetWidth;
          contactSection.classList.add("glow");
          setTimeout(() => contactSection.classList.remove("glow"), 1800);
        });
      }
    });
  </script>
</body>
</html>
