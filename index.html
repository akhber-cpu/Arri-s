<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ariel Akhber — Portfolio</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    :root {
      --bg: #0c0f12;
      --panel: rgba(20,22,28,0.72);
      --panel-border: rgba(255,255,255,0.06);
      --text: #e7eaee;
      --muted: #a7b0bd;
      --accent: #76a9ff;
      --accent-2: #8a7bff;
      --radius: 24px;
      --shadow: 0 10px 40px rgba(0,0,0,0.45);
    }

    * { box-sizing: border-box; scroll-behavior: smooth; }

    body {
      margin: 0;
      font-family: "Poppins", sans-serif;
      background: radial-gradient(1200px 800px at 70% -10%, #151a23 0%, #0d1117 50%, var(--bg) 100%);
      color: var(--text);
    }

    .site-wrap {
      max-width: 1120px;
      margin: 0 auto;
      padding: 24px clamp(16px, 3vw, 28px);
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      padding: clamp(20px, 3.4vw, 36px);
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      display: grid;
      place-items: center;
      color: #0a0e13;
      font-weight: 800;
    }

    .cta {
      background: var(--accent);
      border: 1px solid var(--accent);
      color: #fff;
      padding: 10px 18px;
      border-radius: 999px;
      cursor: pointer;
      text-decoration: none;
      font-weight: 600;
      transition: background-color .2s, border-color .2s, transform .2s;
    }
    .cta:hover {
      background: #5a95e7;
      border-color: #5a95e7;
      transform: translateY(-1px);
    }

    .hero { text-align: center; margin-bottom: 24px; }

    .hero-title {
      display: flex;
      flex-direction: column;
      align-items: center;
      line-height: 1.05;
      margin: 0;
    }
    .hero-title .line-main {
      font-size: clamp(2.4rem, 5vw, 3rem);
      font-weight: 700;
      letter-spacing: 0.03em;
    }
    .hero-title .line-sub {
      font-size: clamp(1.8rem, 4vw, 2.2rem);
      font-weight: 600;
      letter-spacing: 0.06em;
      margin-top: 0.18em;
      max-width: 92%;
      text-align: center;
    }

    .projects {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin: 22px 0 28px;
    }
    @media (max-width: 900px) { .projects { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 600px) { .projects { grid-template-columns: 1fr; } }

    .card {
      position: relative;
      background: #000;
      border: 1px solid rgba(255,255,255,.06);
      border-radius: 18px;
      overflow: hidden;
      min-height: 200px;
      cursor: pointer;
      transition: transform .3s ease, box-shadow .3s ease, border-color .3s ease;
    }
    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 12px 32px rgba(0,0,0,.5), 0 6px 18px rgba(118,169,255,.2);
      border-color: rgba(118,169,255,.3);
    }

    .thumb {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform .6s ease, filter .6s ease;
    }
    .card:hover .thumb { transform: scale(1.08); filter: brightness(1.1); }

    .card.placeholder {
      cursor: default;
      background: #1a1e26;
      display: grid;
      place-items: center;
    }
    .card.placeholder:hover { transform: none; box-shadow: none; border-color: rgba(255,255,255,.06); }

    .placeholder-text {
      color: var(--muted);
      font-weight: 500;
      font-size: 1.1rem;
      opacity: 0.6;
    }

    #contact {
      margin-top: 40px;
      border-radius: 24px;
      padding: 32px 24px 24px;
      position: relative;
    }

    #contact.glow { animation: contactGlow 1.6s ease-out; }

    @keyframes contactGlow {
      0% { box-shadow: 0 0 0 0 rgba(118,169,255,0); }
      35% {
        box-shadow:
          0 0 0 1px rgba(118,169,255,0.9),
          0 0 35px rgba(118,169,255,0.7);
      }
      100% { box-shadow: 0 0 0 0 rgba(118,169,255,0); }
    }

    .about { text-align: center; max-width: 720px; margin: 0 auto 10px; }
    .about h4 { margin: 0 0 12px; font-size: 18px; }
    .about p { margin: 0; color: var(--muted); line-height: 1.7; font-size: 15px; }

    .social-links { text-align: center; margin: 20px 0 0; }
    .social-links a {
      color: var(--text);
      margin: 0 14px;
      font-size: 26px;
      transition: color .2s, transform .2s;
    }
    .social-links a:hover { color: var(--accent); transform: translateY(-2px); }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.85);
      justify-content: center;
      align-items: center;
      z-index: 999;
      padding: 24px;
    }
    .modal-content {
      width: min(900px, 92vw);
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
    }
    .modal iframe { width: 100%; height: 100%; border: none; }

    .close {
      position: fixed;
      top: 18px;
      right: 22px;
      font-size: 40px;
      line-height: 1;
      color: #fff;
      background: transparent;
      border: none;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <div class="site-wrap">
    <header>
      <div class="brand">
        <div class="brand-mark">AA</div>
        <div class="brand-name">Ariel Akhber</div>
      </div>
      <a href="#contact" class="cta">Let’s Connect</a>
    </header>

    <main class="panel">
      <section class="hero">
        <h1 class="hero-title">
          <span class="line-main">VIDEO EDITOR</span>
          <span class="line-sub">& AI VISUAL CREATOR</span>
        </h1>
      </section>

      <section class="projects" id="projectsGrid" aria-label="Video gallery"></section>

      <section id="contact">
        <div class="about">
          <h4>ABOUT ME</h4>
          <p>Experienced video editor with a background in news and branded content, currently specializing in direct response advertising. My work balances precision with a focus on viewer attention and engagement.</p>
        </div>
        <div class="social-links">
          <a href="mailto:akhber@gmail.com" aria-label="Email"><i class="fas fa-envelope"></i></a>
          <a href="https://www.linkedin.com/in/ariel-akhber-a75b20251" target="_blank" rel="noopener" aria-label="LinkedIn"><i class="fab fa-linkedin"></i></a>
          <a href="https://www.instagram.com/arielakhber/" target="_blank" rel="noopener" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
        </div>
      </section>
    </main>
  </div>

  <div id="videoModal" class="modal" aria-hidden="true">
    <button class="close" type="button" aria-label="Close video">×</button>
    <div class="modal-content" role="dialog" aria-modal="true">
      <iframe id="videoFrame" src="" allow="autoplay; encrypted-media" allowfullscreen></iframe>
    </div>
  </div>

  <script>
    function openModal(videoId) {
      const modal = document.getElementById("videoModal");
      const frame = document.getElementById("videoFrame");
      modal.style.display = "flex";
      modal.setAttribute("aria-hidden", "false");
      frame.src = "https://www.youtube.com/embed/" + videoId + "?autoplay=1";
    }

    function closeModal() {
      const modal = document.getElementById("videoModal");
      const frame = document.getElementById("videoFrame");
      modal.style.display = "none";
      modal.setAttribute("aria-hidden", "true");
      frame.src = "";
    }

    // Gallery order (A–H) — A ↔ F
    const videos = [
      { id: "cFrAQUphw9w", title: "New Project 8" },          // A
      { id: "8QjhPqj04_M", title: "Cholesterol" },            // B
      { id: "sNv0KbdY40A", title: "Social Media Campaign" },  // C
      { id: "XCvmRAv60n0", title: "Short Form Ad" },          // D
      { id: "4ocju5hdgsI", title: "Product Launch" },         // E
      { id: "Ojvk73VGJRs", title: "New Project 7" },          // F
      { id: "7mzELoA_4TA", title: "Baking Soda Ad" },         // G
      { id: "eIkSXcvXmnU", title: "Turmeric Omega Launch" }   // H
      { id: "Q4pcstfcHyA", title: "New Project 9" }           // I
    ];

    function renderGallery() {
      const grid = document.getElementById("projectsGrid");
      if (!grid) return;

      grid.innerHTML =
        videos.map(v => `
          <article class="card" data-video-id="${v.id}">
            <img class="thumb"
              src="https://img.youtube.com/vi/${v.id}/hqdefault.jpg"
              alt="Video thumbnail for ${v.title}"
              loading="lazy">
          </article>
        `).join("") +
        `<article class="card placeholder"><div class="placeholder-text">Coming Soon</div></article>`;

      grid.addEventListener("click", (e) => {
        const card = e.target.closest(".card[data-video-id]");
        if (!card) return;
        openModal(card.dataset.videoId);
      });
    }

    document.addEventListener("DOMContentLoaded", () => {
      renderGallery();

      document.querySelector(".close")?.addEventListener("click", closeModal);
      const modal = document.getElementById("videoModal");
      modal?.addEventListener("click", (e) => { if (e.target === modal) closeModal(); });
      document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeModal(); });

      const connectBtn = document.querySelector(".cta");
      const contactSection = document.getElementById("contact");
      if (connectBtn && contactSection) {
        connectBtn.addEventListener("click", (e) => {
          e.preventDefault();
          contactSection.scrollIntoView({ behavior: "smooth", block: "center" });
          contactSection.classList.remove("glow");
          void contactSection.offsetWidth;
          contactSection.classList.add("glow");
          setTimeout(() => contactSection.classList.remove("glow"), 1800);
        });
      }
    });
  </script>
</body>
</html>
